name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Install Dependencies
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          echo '{"appId":"com.tasks.app","appName":"Tasks","webDir":"public","bundledWebRuntime":false}' > capacitor.config.json
          mkdir -p public && cp index.html manifest.json sw.js public/
          npx cap add android

      - name: Copy assets
        run: |
          mkdir -p android/app/src/main/assets/public
          cp public/* android/app/src/main/assets/public/

      - name: Configure gradle
        run: |
          cd android
          cat > gradle.properties << 'EOF'
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=false
kotlin.code.style=official
EOF

      - name: Add dependency resolution
        run: |
          cd android/app
          cat >> build.gradle << 'EOF'

configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-common:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}
EOF

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tasks-app.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk