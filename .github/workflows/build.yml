name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Create capacitor config
        run: |
          echo '{"appId":"com.tasks.app","appName":"Tasks","webDir":"public","bundledWebRuntime":false}' > capacitor.config.json

      - name: Create public directory
        run: mkdir -p public && cp index.html manifest.json sw.js public/

      - name: Add Android platform
        run: npx cap add android

      - name: Copy assets to android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp public/* android/app/src/main/assets/public/

      - name: Configure gradle.properties
        run: |
          cd android
          cat > gradle.properties << 'EOF'
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=false
kotlin.code.style=official
EOF

      - name: Fix build.gradle with dependency resolution
        run: |
          cd android
          # Read the current build.gradle
          cat app/build.gradle

      - name: Modify app/build.gradle with force resolution
        run: |
          cd android/app
          # Add resolution strategy to force consistent kotlin version
          cat >> build.gradle << 'GRADLE'

// Force consistent Kotlin stdlib version
configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-common:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}
GRADLE

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tail -50

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tasks-app.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk