name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Install Capacitor 5.7.0
        run: |
          npm init -y
          npm install @capacitor/core@5.7.0 @capacitor/cli@5.7.0 @capacitor/android@5.7.0

      - name: Initialize
        run: |
          echo '{"appId":"com.tasks.app","appName":"Tasks","webDir":"public","bundledWebRuntime":false}' > capacitor.config.json
          mkdir -p public
          cp index.html manifest.json sw.js public/
          npx cap add android

      - name: Copy assets
        run: |
          mkdir -p android/app/src/main/assets/public
          cp public/* android/app/src/main/assets/public/

      - name: Build
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tasks-app.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk