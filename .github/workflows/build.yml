name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Create capacitor config
        run: |
          echo '{"appId":"com.tasks.app","appName":"Tasks","webDir":"public","bundledWebRuntime":false}' > capacitor.config.json

      - name: Create public directory
        run: mkdir -p public && cp index.html manifest.json sw.js public/

      - name: Add Android platform
        run: npx cap add android

      - name: Copy assets to android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp public/* android/app/src/main/assets/public/

      - name: Fix Kotlin version conflict - add gradle config
        run: |
          cd android
          cat >> gradle.properties << 'EOF'
  android.useAndroidX=true
  android.enableJetifier=true
  kotlin.stdlib.default.dependency=false
  android.nonTransitiveRClass=false
EOF
          # Add dependency resolution to build.gradle
          sed -i 's/plugins {/plugins {\n    id("com.android.application") version "8.2.0"/' app/build.gradle
          cat >> app/build.gradle << 'EOF'
configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
EOF

      - name: Build APK
        working-directory: android
        run: ./gradlew clean assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tasks-app.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk