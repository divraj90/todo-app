<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: #fafafa;
      color: #1a1a1a;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .container {
      max-width: 520px;
      margin: 0 auto;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 600;
      margin-bottom: 32px;
      letter-spacing: -0.02em;
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 32px;
    }

    input[type="text"] {
      flex: 1;
      padding: 14px 16px;
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      font-size: 0.95rem;
      font-family: inherit;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #1a1a1a;
      box-shadow: 0 0 0 3px rgba(26, 26, 26, 0.08);
    }

    input[type="text"]::placeholder { color: #a0a0a0; }

    button.add-btn {
      padding: 14px 20px;
      background: #1a1a1a;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.15s;
    }

    button.add-btn:hover { transform: scale(1.02); }
    button.add-btn:active { transform: scale(0.98); }

    .filters {
      display: flex;
      gap: 4px;
      margin-bottom: 20px;
    }

    .filter {
      padding: 8px 14px;
      border: none;
      background: transparent;
      font-size: 0.85rem;
      font-weight: 500;
      color: #666;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.15s;
    }

    .filter:hover { background: #f0f0f0; }
    .filter.active { background: #1a1a1a; color: #fff; }

    .task-list { list-style: none; }

    .task {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      background: #fff;
      border-radius: 12px;
      margin-bottom: 8px;
      border: 1px solid #e8e8e8;
      transition: all 0.2s;
    }

    .task:hover { border-color: #d0d0d0; }
    .task.completed { opacity: 0.5; }
    .task.completed .task-text { text-decoration: line-through; }

    .task-checkbox {
      width: 20px;
      height: 20px;
      border: 2px solid #d0d0d0;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .task-checkbox:hover { border-color: #1a1a1a; }
    .task.completed .task-checkbox {
      background: #22c55e;
      border-color: #22c55e;
    }

    .task.completed .task-checkbox::after {
      content: '✓';
      color: #fff;
      font-size: 12px;
    }

    .task-text {
      flex: 1;
      font-size: 0.95rem;
      background: transparent;
      border: none;
      font-family: inherit;
      color: inherit;
      outline: none;
    }

    .task-text:focus {
      background: #fafafa;
      padding: 4px 8px;
      margin: -4px -8px;
      border-radius: 6px;
    }

    .delete-btn {
      padding: 6px;
      background: transparent;
      border: none;
      color: #ccc;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.15s;
      opacity: 0;
    }

    .task:hover .delete-btn { opacity: 1; }
    .delete-btn:hover { background: #fee; color: #ef4444; }

    .count {
      color: #888;
      font-size: 0.85rem;
      margin-top: 24px;
    }

    .empty {
      text-align: center;
      padding: 60px 20px;
      color: #aaa;
    }

    .empty svg { margin-bottom: 16px; opacity: 0.3; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Tasks</h1>

    <div class="input-group">
      <input type="text" id="taskInput" placeholder="Add a new task...">
      <button class="add-btn" id="addBtn">Add</button>
    </div>

    <div class="filters">
      <button class="filter active" data-filter="all">All</button>
      <button class="filter" data-filter="active">Active</button>
      <button class="filter" data-filter="done">Done</button>
    </div>

    <ul class="task-list" id="taskList"></ul>
    <p class="count" id="count"></p>
  </div>

  <script>
    let tasks = JSON.parse(localStorage.getItem('tasks')) || [];
    let filter = 'all';

    const taskInput = document.getElementById('taskInput');
    const addBtn = document.getElementById('addBtn');
    const taskList = document.getElementById('taskList');
    const count = document.getElementById('count');
    const filters = document.querySelectorAll('.filter');

    function save() {
      localStorage.setItem('tasks', JSON.stringify(tasks));
    }

    function render() {
      const filtered = tasks.filter(t => {
        if (filter === 'active') return !t.done;
        if (filter === 'done') return t.done;
        return true;
      });

      if (filtered.length === 0) {
        taskList.innerHTML = `
          <div class="empty">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
            </svg>
            <p>No tasks yet</p>
          </div>
        `;
      } else {
        taskList.innerHTML = filtered.map((t, i) => `
          <li class="task ${t.done ? 'completed' : ''}" data-index="${tasks.indexOf(t)}">
            <div class="task-checkbox" onclick="toggle(${tasks.indexOf(t)})"></div>
            <input type="text" class="task-text" value="${t.text}"
                   onchange="updateText(${tasks.indexOf(t)}, this.value)"
                   onclick="this.select()">
            <button class="delete-btn" onclick="remove(${tasks.indexOf(t)})">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M18 6L6 18M6 6l12 12"/>
              </svg>
            </button>
          </li>
        `).join('');
      }

      const active = tasks.filter(t => !t.done).length;
      count.textContent = filter === 'done' ? `${filtered.length} completed` :
                          filter === 'active' ? `${filtered.length} remaining` :
                          `${active} of ${tasks.length} remaining`;
    }

    function add() {
      const text = taskInput.value.trim();
      if (!text) return;
      tasks.unshift({ text, done: false });
      taskInput.value = '';
      save();
      render();
    }

    function toggle(i) {
      tasks[i].done = !tasks[i].done;
      save();
      render();
    }

    function updateText(i, text) {
      tasks[i].text = text;
      save();
    }

    function remove(i) {
      tasks.splice(i, 1);
      save();
      render();
    }

    addBtn.addEventListener('click', add);
    taskInput.addEventListener('keypress', e => e.key === 'Enter' && add());

    filters.forEach(f => {
      f.addEventListener('click', () => {
        filters.forEach(x => x.classList.remove('active'));
        f.classList.add('active');
        filter = f.dataset.filter;
        render();
      });
    });

    render();
  </script>
</body>
</html>
